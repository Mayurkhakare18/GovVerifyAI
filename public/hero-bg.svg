<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 2400 1000" width="2400" height="1000">
  <defs>
    <!-- Morning Sky gradient from soft golden horizon to vibrant azure blue -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="20%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="80%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <!-- Sun warmth on horizon -->
    <radialGradient id="sunGlow" cx="20%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FEF08A" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#E0F2FE" stop-opacity="0" />
    </radialGradient>

    <!-- Mist & desk gradient -->
    <linearGradient id="deskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#E2E8F0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="flagSaffron" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#E67300" />
    </linearGradient>

    <linearGradient id="flagGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#0E6006" />
    </linearGradient>

    <!-- Card glass gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#F0F9FF" stop-opacity="0.75" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowCard" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Sky Base -->
  <rect width="2400" height="1000" fill="url(#skyGrad)" />
  <rect width="2400" height="700" fill="url(#sunGlow)" />

  <!-- Distant Clouds & Skyline -->
  <g opacity="0.4">
    <ellipse cx="600" cy="180" rx="350" ry="60" fill="#FFFFFF" />
    <ellipse cx="1400" cy="120" rx="420" ry="70" fill="#FFFFFF" />
    <ellipse cx="2050" cy="140" rx="280" ry="50" fill="#FFFFFF" />
    <ellipse cx="900" cy="220" rx="260" ry="45" fill="#FFFFFF" />
  </g>

  <!-- Embed High-Res Rashtrapati Bhavan Photographic Architecture in center/right -->
  <g id="architecture-photo">
    <mask id="archMask">
      <linearGradient id="archFade" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#000000" stop-opacity="0" />
        <stop offset="12%" stop-color="#FFFFFF" stop-opacity="0.4" />
        <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1" />
      </linearGradient>
      <rect x="700" y="100" width="1700" height="750" fill="url(#archFade)" />
    </mask>

    <image href="public/rashtrapati.jpg" x="700" y="100" width="1700" height="750" preserveAspectRatio="xMidYMid slice" mask="url(#archMask)" opacity="0.95" />
  </g>

  <!-- Indian National Flag on High Pole above Raisina Hill -->
  <g id="indian-flag" transform="translate(1740, 60)">
    <line x1="0" y1="0" x2="0" y2="280" stroke="#CBD5E1" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="6" fill="#F59E0B" />
    <!-- Flag with wavy ripple path -->
    <path d="M 0 10 Q 50 0 95 12 T 180 8 L 180 48 Q 135 42 95 50 T 0 46 Z" fill="url(#flagSaffron)" />
    <path d="M 0 46 Q 50 38 95 50 T 180 48 L 180 88 Q 135 82 95 90 T 0 86 Z" fill="#FFFFFF" />
    <path d="M 0 86 Q 50 78 95 90 T 180 88 L 180 128 Q 135 122 95 130 T 0 126 Z" fill="url(#flagGreen)" />
    <!-- Ashoka Chakra -->
    <circle cx="90" cy="67" r="14" fill="none" stroke="#000080" stroke-width="2" />
    <circle cx="90" cy="67" r="2.5" fill="#000080" />
    <g stroke="#000080" stroke-width="1.2">
      <line x1="90" y1="53" x2="90" y2="81" />
      <line x1="76" y1="67" x2="104" y2="67" />
      <line x1="80" y1="57" x2="100" y2="77" />
      <line x1="80" y1="77" x2="100" y2="57" />
    </g>
  </g>

  <!-- Left: India Map Hologram Silhouette with Network Nodes -->
  <g id="india-network" opacity="0.88">
    <!-- Stylized India outline path -->
    <path d="M 460 140 C 470 120, 500 130, 520 150 C 540 170, 560 175, 570 190 C 580 210, 610 230, 615 260 C 600 270, 580 260, 570 270 C 560 300, 550 330, 535 360 C 525 385, 500 420, 480 440 C 470 420, 450 390, 435 370 C 410 350, 390 320, 375 290 C 370 260, 395 240, 410 220 C 430 200, 445 165, 460 140 Z" fill="#38BDF8" fill-opacity="0.12" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6,4" filter="url(#softGlow)" />

    <!-- Connecting network lines -->
    <path d="M 380 220 L 450 180 L 530 210 L 610 270 L 530 350 L 440 320 L 380 220" fill="none" stroke="#60A5FA" stroke-width="1.8" stroke-opacity="0.75" />
    <path d="M 450 180 L 530 350" fill="none" stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4,4" />
    <path d="M 380 220 L 530 210" fill="none" stroke="#60A5FA" stroke-width="1.2" stroke-opacity="0.5" stroke-dasharray="4,4" />

    <!-- Nodes with Icons (Document, Cap, Search, Citizen, Institution) -->
    <!-- Node 1: Document -->
    <g transform="translate(380, 220)">
      <circle cx="0" cy="0" r="28" fill="#FFFFFF" fill-opacity="0.92" stroke="#0284C7" stroke-width="2.5" filter="url(#shadowCard)" />
      <circle cx="0" cy="0" r="34" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="3,3" />
      <path d="M -8 -11 L 2 -11 L 8 -5 L 8 11 L -8 11 Z" fill="none" stroke="#0369A1" stroke-width="2.2" stroke-linejoin="round" />
      <line x1="-4" y1="-2" x2="4" y2="-2" stroke="#0369A1" stroke-width="2" />
      <line x1="-4" y1="4" x2="4" y2="4" stroke="#0369A1" stroke-width="2" />
    </g>

    <!-- Node 2: Education / Cap -->
    <g transform="translate(450, 180)">
      <circle cx="0" cy="0" r="28" fill="#FFFFFF" fill-opacity="0.92" stroke="#0284C7" stroke-width="2.5" filter="url(#shadowCard)" />
      <path d="M 0 -8 L 12 -2 L 0 4 L -12 -2 Z" fill="#0369A1" />
      <path d="M -8 1 L -8 7 C -8 10, 8 10, 8 7 L 8 1" fill="none" stroke="#0369A1" stroke-width="2" />
    </g>

    <!-- Node 3: Search Magnifier -->
    <g transform="translate(530, 210)">
      <circle cx="0" cy="0" r="28" fill="#FFFFFF" fill-opacity="0.92" stroke="#0284C7" stroke-width="2.5" filter="url(#shadowCard)" />
      <circle cx="-2" cy="-2" r="7" fill="none" stroke="#0369A1" stroke-width="2.4" />
      <line x1="3" y1="3" x2="9" y2="9" stroke="#0369A1" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Node 4: Institution Landmark -->
    <g transform="translate(610, 270)">
      <circle cx="0" cy="0" r="28" fill="#FFFFFF" fill-opacity="0.92" stroke="#0284C7" stroke-width="2.5" filter="url(#shadowCard)" />
      <path d="M -9 -2 L 0 -8 L 9 -2 Z" fill="#0369A1" />
      <line x1="-7" y1="-1" x2="-7" y2="7" stroke="#0369A1" stroke-width="2" />
      <line x1="-1" y1="-1" x2="-1" y2="7" stroke="#0369A1" stroke-width="2" />
      <line x1="5" y1="-1" x2="5" y2="7" stroke="#0369A1" stroke-width="2" />
      <line x1="-10" y1="8" x2="10" y2="8" stroke="#0369A1" stroke-width="2" />
    </g>

    <!-- Node 5: Citizen -->
    <g transform="translate(440, 320)">
      <circle cx="0" cy="0" r="28" fill="#FFFFFF" fill-opacity="0.92" stroke="#0284C7" stroke-width="2.5" filter="url(#shadowCard)" />
      <circle cx="0" cy="-4" r="5" fill="#0369A1" />
      <path d="M -8 8 C -8 4, 8 4, 8 8" fill="none" stroke="#0369A1" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

  <!-- Right Floating Glass Cards -->
  <g id="floating-cards" transform="translate(1980, 420)">
    <!-- Card 1: PDF Document Card -->
    <rect x="0" y="0" width="220" height="74" rx="12" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-width="1.8" filter="url(#shadowCard)" />
    <!-- Red PDF badge -->
    <rect x="14" y="14" width="34" height="20" rx="4" fill="#DC2626" />
    <text x="31" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PDF</text>
    <rect x="58" y="16" width="90" height="6" rx="3" fill="#94A3B8" />
    <rect x="58" y="28" width="60" height="5" rx="2.5" fill="#CBD5E1" />
    <!-- Green Check Circle -->
    <circle cx="190" cy="24" r="10" fill="#159B62" />
    <path d="M 186 24 L 189 27 L 195 21" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Card 2: National Emblem / Pillar summary -->
    <g transform="translate(20, 95)">
      <rect x="0" y="0" width="220" height="90" rx="12" fill="url(#glassGrad)" stroke="#FFFFFF" stroke-width="1.8" filter="url(#shadowCard)" />
      <rect x="14" y="18" width="40" height="54" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
      <!-- Emblem stylized silhouette -->
      <circle cx="34" cy="36" r="8" fill="#1E3A8A" fill-opacity="0.75" />
      <rect x="26" y="48" width="16" height="12" rx="2" fill="#1E3A8A" fill-opacity="0.75" />
      <rect x="66" y="22" width="110" height="7" rx="3.5" fill="#64748B" />
      <rect x="66" y="36" width="80" height="6" rx="3" fill="#94A3B8" />
      <rect x="66" y="48" width="95" height="5" rx="2.5" fill="#CBD5E1" />
      <!-- Green Check Circle -->
      <circle cx="190" cy="30" r="10" fill="#159B62" />
      <path d="M 186 30 L 189 33 L 195 27" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Desk Foreground with Stack of Books & Plant -->
  <g id="desk-foreground" transform="translate(0, 680)">
    <!-- Desk surface bar -->
    <rect x="0" y="80" width="2400" height="240" fill="url(#deskGrad)" />
    <line x1="0" y1="80" x2="2400" y2="80" stroke="#94A3B8" stroke-width="2" stroke-opacity="0.5" />

    <!-- Stack of Books on left -->
    <g transform="translate(320, 20)">
      <!-- Book 4: Reports & Documents -->
      <rect x="0" y="80" width="360" height="28" rx="3" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
      <text x="180" y="98" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Reports &amp; Documents</text>

      <!-- Book 3: Official Notifications -->
      <rect x="4" y="52" width="352" height="28" rx="3" fill="#1E3A8A" stroke="#1D4ED8" stroke-width="1.2" />
      <text x="180" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#BFDBFE" text-anchor="middle">Official Notifications</text>

      <!-- Book 2: Policies & Guidelines -->
      <rect x="8" y="24" width="344" height="28" rx="3" fill="#1D4ED8" stroke="#3B82F6" stroke-width="1.2" />
      <text x="180" y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#DBEAFE" text-anchor="middle">Policies &amp; Guidelines</text>

      <!-- Book 1: Government Schemes -->
      <rect x="12" y="-4" width="336" height="28" rx="3" fill="#2563EB" stroke="#60A5FA" stroke-width="1.2" />
      <text x="180" y="14" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Government Schemes</text>
    </g>

    <!-- Pen Holder -->
    <g transform="translate(710, 40)">
      <rect x="0" y="20" width="45" height="55" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5" />
      <line x1="12" y1="-10" x2="16" y2="40" stroke="#0F172A" stroke-width="4" stroke-linecap="round" />
      <line x1="26" y1="-16" x2="22" y2="40" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round" />
      <line x1="36" y1="-8" x2="30" y2="40" stroke="#059669" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Lush Green Desk Leaves (Foreground Left edge) -->
    <g transform="translate(80, 0)">
      <circle cx="-20" cy="50" r="45" fill="#15803D" opacity="0.8" />
      <circle cx="20" cy="20" r="38" fill="#16A34A" opacity="0.85" />
      <circle cx="50" cy="65" r="42" fill="#22C55E" opacity="0.9" />
      <circle cx="-10" cy="-10" r="32" fill="#4ADE80" opacity="0.7" />
    </g>
  </g>
</svg>
